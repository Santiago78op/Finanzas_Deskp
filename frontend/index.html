<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanzas Personales</title>
  <!-- Los tres roles tipográficos (titulares serif / cuerpo Inter / cifras
       monoespaciadas). Van desde Google Fonts: si no hay red, index.css cae a
       Georgia + system-ui + la monoespaciada del sistema y la app sigue
       usable, solo pierde el look editorial. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <!-- Aplicar el tema guardado ANTES de pintar, para evitar el destello -->
  <script>
    // ?tema=light|dark fuerza el tema (útil para pruebas); si no, el guardado
    document.documentElement.dataset.theme =
      new URLSearchParams(location.search).get('tema')
      || localStorage.getItem('tema') || 'light';
  </script>
</head>
<body>

<!-- Plantilla de íconos SVG (estilo Lucide/stroke).
     Se instancian con <svg class="ico"><use href="#ico-nombre"/></svg>

     Son <symbol viewBox="0 0 24 24">, NO <g>. Con <g> el <use> copia el
     dibujo tal cual, en coordenadas absolutas: un ícono de 24×24 metido en un
     <svg> de 18×18 sin viewBox se RECORTABA (se perdían 6px abajo y a la
     derecha) y, como cada ícono tiene su tinta en un lugar distinto del lienzo
     (unos arrancan en y=2, otros en y=5), cada uno quedaba desplazado y de un
     tamaño aparente distinto — eso era lo que se veía "desalineado".
     El viewBox del <symbol> hace que el dibujo ESCALE al tamaño del <svg>
     que lo usa, sea 17, 18 o 26px. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ico-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/>
    </symbol>
    <symbol id="ico-billetera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12V7H5a2 2 0 0 1-2-2 2 2 0 0 1 2-2h14v4"/>
      <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
      <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
    </symbol>
    <symbol id="ico-lapiz" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </symbol>
    <symbol id="ico-barras" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>
    </symbol>
    <symbol id="ico-recibo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/>
      <path d="M8 7h8"/><path d="M8 11h8"/><path d="M8 15h5"/>
    </symbol>
    <symbol id="ico-banco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/>
      <line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/>
      <line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/>
    </symbol>
    <symbol id="ico-ajustes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
    </symbol>
    <symbol id="ico-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/>
      <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/>
      <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/>
      <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>
    </symbol>
    <symbol id="ico-registro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 8.5v7M8.5 12h7"/>
    </symbol>
    <symbol id="ico-tarjeta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
      <path d="M2.5 9.5h19"/><path d="M6 15h4.5"/>
    </symbol>
    <symbol id="ico-prestamo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="3" width="14" height="18" rx="2"/>
      <path d="M9 16l6-6"/><circle cx="9.5" cy="10.5" r="1"/><circle cx="14.5" cy="15.5" r="1"/>
    </symbol>
    <!-- Alcancía (Ahorros): cuerpo redondeado + ranura, hocico, oreja y patas. -->
    <symbol id="ico-alcancia" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 12.5a7 7 0 0 1 7-7h4a7 7 0 0 1 6.6 4.7l1.9.8v3.5l-1.9.5a7 7 0 0 1-2.6 3.3V21h-3v-1.6a7 7 0 0 1-1 .1h-4v1.5h-3V19a7 7 0 0 1-4-6.5Z"/>
      <path d="M9 5.5 11 2l2.2 3.5"/>
      <path d="M9 9.5h4"/>
      <circle cx="17" cy="12.5" r=".6" fill="currentColor"/>
    </symbol>
    <symbol id="ico-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/><path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
    </symbol>
    <symbol id="ico-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </symbol>
  </defs>
</svg>

<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
